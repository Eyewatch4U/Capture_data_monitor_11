name: Capturar Meltwater · Oniria TBWA PY

on:
  workflow_dispatch:        # disparado por cron-job.org (sin schedule: nativo)

concurrency:
  group: oniria-py-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Capturar snapshot y publicar
        env:
          MELTWATER_URL:      ${{ secrets.MELTWATER_URL }}
          MELTWATER_PASSWORD: ${{ secrets.MELTWATER_PASSWORD }}
          # Entrega directa al worker (estándar NSG). Si no están, usa Make.
          WORKER_INGEST_URL:  ${{ secrets.WORKER_INGEST_URL }}
          SYNC_TOKEN:         ${{ secrets.SYNC_TOKEN }}
          MAKE_WEBHOOK_URL:   ${{ secrets.MAKE_WEBHOOK_URL }}
          MAX_WAIT_SECONDS:   '300'
          JITTER_SECONDS:     '20'
        run: python capture_meltwater.py

      - name: Subir debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug_output/
          retention-days: 5
          if-no-files-found: ignore
